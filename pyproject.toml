[project]
name = "vision-based-crosswalk-risk-warning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "audioop-lts>=0.2.2",
    "gtts>=2.5.4",
    "lap>=0.5.13",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pydub>=0.25.1",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.156",

    "torch==2.14.0",
    "torchvision==0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
